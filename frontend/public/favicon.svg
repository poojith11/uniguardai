<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle Outer Cyber Glow Effect -->
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B26" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
  </defs>

  <!-- Base Dark Shield Container -->
  <path 
    d="M32 4 L54 12 C54 36 44 52 32 60 C20 52 10 36 10 12 Z" 
    fill="url(#shieldBg)" 
    stroke="url(#cyanGrad)" 
    stroke-width="3.5" 
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Accent Line -->
  <path 
    d="M32 9 L49 15.5 C49 34 40.5 47.5 32 54.5 C23.5 47.5 15 34 15 15.5 Z" 
    fill="none" 
    stroke="#00E5FF" 
    stroke-width="1" 
    stroke-opacity="0.35"
  />

  <!-- Stylized High-Contrast "U" Security Monogram -->
  <!-- Left Pillar -->
  <path 
    d="M23 20 V33 C23 38 27 42 32 42 C37 42 41 38 41 33 V20" 
    fill="none" 
    stroke="url(#uGrad)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Central Passive Diode / AI Core Beacon -->
  <circle cx="32" cy="27" r="2.5" fill="#00E5FF" />
  <circle cx="32" cy="27" r="4.5" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.6" />
</svg>